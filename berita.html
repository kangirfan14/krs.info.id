<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="krsduwur.png" />
    
    <!-- Open Graph Meta Tags untuk Preview saat Dibagikan -->
    <title id="metaTitle">Berita | #karangsarineweru</title>
    <meta property="og:title" id="ogTitle" content="Detail Berita - krs.info" />
    <meta
      property="og:description"
      id="ogDesc"
      content="Baca berita dan informasi terkini dari krs.info"
    />
    <meta property="og:image" id="ogImage" content="" />
    <meta property="og:url" id="ogUrl" content="" />
    <meta property="og:type" content="article" />

    <!-- Font & Icon -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
<!-- Panggil file persetujuan.js -->
  <script src="persetujuan.js" defer></script>
    <style>
      :root {
        --primary-red: #800000;
        --primary-dark: #1a0000;
        --bg-light: #f8fafc;
        --text-main: #0f172a;
        --text-muted: #475569;
        --border-color: #e2e8f0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: var(--bg-light);
        color: var(--text-main);
        line-height: 1.7;
        padding-top: 100px;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* OVERLAY GELAP DI LUAR PANEL MOBILE */
      .mobile-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(15, 23, 42, 0.5);
        z-index: 1098;
        backdrop-filter: blur(2px);
      }

      /* KONTEN UTAMA ARTIKEL */
      .article-container {
        max-width: 850px;
        width: 100%;
        margin: 20px auto 60px auto;
        padding: 0 20px;
        flex: 1;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--primary-red);
        text-decoration: none;
        font-weight: 700;
        font-size: 0.9rem;
        margin-bottom: 20px;
        transition: color 0.2s, transform 0.2s;
      }

      .back-btn:hover {
        color: #b91c1c;
        transform: translateX(-3px);
      }

      .article-title {
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--text-main);
        line-height: 1.3;
        margin-bottom: 15px;
      }

      .article-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: center;
        font-size: 0.9rem;
        color: var(--text-muted);
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 1px solid var(--border-color);
      }

      .article-meta span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .article-meta .badge-kategori {
        background: var(--primary-red);
        color: #ffffff;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .article-image-wrapper {
        width: 100%;
        max-height: 450px;
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 35px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        background-color: #fee2e2;
      }

      .article-image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .article-body-content {
        font-size: 1.05rem;
        color: #334155;
        line-height: 1.8;
        margin-bottom: 40px;
        text-align: justify;
      }

      .article-body-content p {
        margin-bottom: 20px;
      }

      /* BAGIAN TOMBOL SHARE */
      .share-section {
        background: #ffffff;
        padding: 24px;
        border-radius: 16px;
        border: 1px solid var(--border-color);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      }

      .share-title {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .share-buttons-grid {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .share-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 50px;
        font-size: 0.88rem;
        font-weight: 600;
        color: #ffffff;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.2s;
      }

      .share-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
      }

      .btn-whatsapp { background-color: #25d366; }
      .btn-facebook { background-color: #1877f2; }
      .btn-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
      .btn-copylink { background-color: #0f172a; }

      /* TOMBOL MELAYANG BACK TO TOP */
      .krs-back-to-top {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--primary-red);
        color: #ffffff;
        border: none;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        z-index: 999;
        opacity: 0;
        visibility: hidden;
        transform: translateY(15px);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .krs-back-to-top.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .krs-back-to-top:hover {
        background: #991b1b;
        transform: translateY(-3px);
      }

      /* STYLING MODAL PROTOKOL KIRIM BERITA */
      .modal-17an-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        padding: 15px;
        box-sizing: border-box;
      }

      .protocol-box {
        background: #ffffff; 
        border-radius: 16px;
        max-width: 550px; 
        width: 100%; 
        max-height: 90vh;
        display: flex; 
        flex-direction: column; 
        overflow: hidden; 
        position: relative;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        animation: popInLegal 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .protocol-header {
        background: #1e293b; 
        color: #ffffff; 
        padding: 16px 20px;
        display: flex; 
        align-items: center; 
        justify-content: space-between;
        border-bottom: 3px solid #d32f2f;
      }
      .protocol-header h4 { margin: 0; font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
      
      .protocol-body {
        padding: 20px; 
        overflow-y: auto; 
        flex: 1; 
        text-align: left;
        font-size: 0.85rem; 
        color: #334155; 
        line-height: 1.6;
      }
      
      .protocol-content-text {
        background: #f8fafc; 
        border: 1px solid #e2e8f0; 
        border-radius: 10px;
        padding: 16px; 
        max-height: 260px; 
        overflow-y: auto;
      }

      .protocol-footer {
        padding: 16px 20px; 
        background: #ffffff; 
        border-top: 1px solid #e2e8f0;
        display: flex; 
        gap: 10px; 
        justify-content: flex-end;
      }
      .btn-cancel-proto {
        background: #e2e8f0; 
        color: #475569; 
        border: none; 
        padding: 10px 18px;
        border-radius: 10px; 
        font-weight: 600; 
        font-size: 0.85rem; 
        cursor: pointer;
      }
      .btn-proceed-proto {
        background: linear-gradient(135deg, #d32f2f 0%, #9a0007 100%);
        color: #ffffff; 
        border: none; 
        padding: 10px 20px; 
        border-radius: 10px;
        font-weight: 700; 
        font-size: 0.85rem; 
        cursor: pointer; 
        display: flex;
        align-items: center; 
        gap: 8px; 
        text-decoration: none;
      }
      @keyframes popInLegal { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

      @media (max-width: 768px) {
        body { padding-top: 80px; }
        .article-title { font-size: 1.7rem; }
        .article-image-wrapper { max-height: 260px; }
        .share-buttons-grid { flex-direction: column; }
        .share-btn { width: 100%; justify-content: center; }
        .krs-back-to-top { bottom: 20px; right: 20px; width: 42px; height: 42px; }
      }
    </style>
  </head>
  <body>
    <!-- Penampung Navbar Otomatis -->
  <div id="navbar-placeholder"></div>

  <!-- Skrip Pengambil Navbar & Inisialisasi Hamburger -->
  <script>
    fetch('navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-placeholder').innerHTML = data;
        
        // Inisialisasi ulang event listener untuk hamburger SETELAH navbar masuk ke DOM
        const hamburgerBtn = document.getElementById('hamburger');
        const navMenu = document.getElementById('menu');

        if (hamburgerBtn && navMenu) {
          hamburgerBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            navMenu.classList.toggle('active');
          });
        }
      })
      .catch(error => console.error('Gagal memuat navbar:', error));

    // Tutup menu jika klik di luar
    document.addEventListener("click", function(event) {
      const menu = document.getElementById("menu");
      const hamburger = document.getElementById("hamburger");

      if (menu && hamburger) {
        if (menu.classList.contains("active") && !menu.contains(event.target) && !hamburger.contains(event.target)) {
          menu.classList.remove("active");
        }
      }
    });

    // TAMBAHKAN FUNGSI INI AGAR TIDAK ERROR "is not defined"
    function handleKirimBerita(targetUrl) {
        const menu = document.getElementById('menu');
        if (menu) menu.classList.remove('active');
        
        // Jika fungsi bukaModalProtokol ada, jalankan; jika tidak, langsung arahkan ke form
        if (typeof bukaModalProtokol === 'function') {
            bukaModalProtokol(targetUrl || 'kirim-berita.html');
        } else {
            window.location.href = targetUrl || 'kirim-berita.html';
        }
    }

    function triggerKirimBerita() {
        handleKirimBerita('kirim-berita.html');
    }
  </script>

    <!-- KONTEN UTAMA ARTIKEL -->
    <main class="article-container" id="articleContentWrapper">
      <a href="index.html#Berita" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Berita
      </a>
      <div style="text-align: center; padding: 60px 0; color: #64748b">
        Memuat detail berita...
      </div>
    </main>

    <!-- TOMBOL BACK TO TOP -->
    <button id="btnBackToTop" class="krs-back-to-top" title="Kembali ke atas">
      <i class="fa-solid fa-arrow-up"></i>
    </button>

    <!-- PENAMPUNG FOOTER OTOMATIS -->
    <div id="footer-placeholder"></div>

    <script>
      fetch('footer.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('footer-placeholder').innerHTML = data;
        })
        .catch(error => console.error('Gagal memuat footer:', error));
    </script>

    <!-- DATABASE & LOGIKA UTAMA -->
    <script src="berita-data.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const urlParams = new URLSearchParams(window.location.search);
        const beritaId = urlParams.get("id");
        const container = document.getElementById("articleContentWrapper");

        if (typeof DATABASE_BERITA !== "undefined" && beritaId) {
          const berita = DATABASE_BERITA.find((item) => item.id == beritaId);

          if (berita) {
            // Konversi Gambar ke URL Absolut Full (Wajib untuk Preview Sosmed)
            let rawImage = berita.gambar || "";
            let absoluteImageUrl = rawImage;
            if (rawImage && !rawImage.startsWith("http://") && !rawImage.startsWith("https://")) {
              const cleanPath = rawImage.startsWith("/") ? rawImage : "/" + rawImage;
              absoluteImageUrl = window.location.origin + cleanPath;
            }

            // Paksa Update Open Graph Meta Tags secara Dinamis
            document.getElementById("metaTitle").innerText = `${berita.judul} - krs.info`;
            
            const forceMeta = (id, propertyName, contentValue) => {
              let el = document.getElementById(id);
              if (!el) {
                el = document.createElement('meta');
                el.id = id;
                el.setAttribute('property', propertyName);
                document.head.appendChild(el);
              }
              el.setAttribute("content", contentValue);
            };

            forceMeta("ogTitle", "og:title", berita.judul);
            forceMeta("ogDesc", "og:description", berita.ringkasan);
            forceMeta("ogImage", "og:image", absoluteImageUrl);
            forceMeta("ogUrl", "og:url", window.location.href);

            const kronologiLengkap = berita.kronologi || berita.isi || berita.deskripsi || `<p>${berita.ringkasan}</p>`;
            const tanggalKejadian = berita.waktuKejadian || berita.tanggalRilis || "Informasi Terkini";

            const shareMessage =
              `📢 *${berita.judul}*\n\n` +
              `"${berita.ringkasan}"\n\n` +
              `-----------------------------------\n` +
              `👉 *Baca selengkapnya di sini:*\n${window.location.href}\n` +
              `-----------------------------------\n` +
              `💡 *krs.info - Media Informasi Desa Karangsari*`;

            container.innerHTML = `
              <a href="index.html#Berita" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Berita
              </a>

              <h1 class="article-title">${berita.judul}</h1>
              
              <div class="article-meta">
                <span><i class="fa-regular fa-calendar"></i> ${tanggalKejadian}</span>
                <span class="badge-kategori"><i class="fa-solid fa-tag"></i> ${berita.kategori}</span>
              </div>

              <div class="article-image-wrapper">
                <img src="${berita.gambar}" alt="${berita.judul}">
              </div>

              <div class="article-body-content">
                ${kronologiLengkap}
              </div>

              <div class="share-section">
                <div class="share-title">
                  <i class="fa-solid fa-share-nodes"></i> Bagikan Berita Ini
                </div>
                <div class="share-buttons-grid">
                  <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(shareMessage)}" target="_blank" class="share-btn btn-whatsapp">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                  </a>
                  <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" target="_blank" class="share-btn btn-facebook">
                    <i class="fa-brands fa-facebook-f"></i> Facebook
                  </a>
                  <button type="button" onclick="shareToInstagram('${encodeURIComponent(berita.judul)}')" class="share-btn btn-instagram">
                    <i class="fa-brands fa-instagram"></i> Instagram
                  </button>
                  <button type="button" onclick="salinTautanBerita()" class="share-btn btn-copylink">
                    <i class="fa-solid fa-link"></i> Salin Tautan
                  </button>
                </div>
              </div>
            `;
          } else {
            container.innerHTML = `
              <a href="index.html#Berita" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali ke Berita</a>
              <div style="text-align:center; padding: 60px 0; color: #dc2626; font-weight:700;">Berita yang kamu cari tidak ditemukan.</div>
            `;
          }
        } else {
          container.innerHTML = `
            <a href="index.html#Berita" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali ke Berita</a>
            <div style="text-align:center; padding: 60px 0; color: #dc2626; font-weight:700;">ID Berita tidak valid.</div>
          `;
        }

        // BACK TO TOP LOGIC
        const btnTop = document.getElementById("btnBackToTop");
        window.addEventListener("scroll", function () {
          if (window.scrollY > 300) {
            btnTop.classList.add("show");
          } else {
            btnTop.classList.remove("show");
          }
        });

        btnTop.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      // FUNGSI SHARE 4 TOMBOL
      function shareToInstagram(judulDecoded) {
        const currentUrl = window.location.href;
        const textToCopy = `📢 ${decodeURIComponent(judulDecoded)}\n\n👉 Baca selengkapnya: ${currentUrl}`;
        
        navigator.clipboard.writeText(textToCopy).then(() => {
          alert("Judul & Tautan berita berhasil disalin! Silakan tempel (paste) pada Story atau Direct Message Instagram Anda.");
          window.open('https://www.instagram.com', '_blank');
        }).catch(() => {
          window.open('https://www.instagram.com', '_blank');
        });
      }

      function salinTautanBerita() {
        const currentUrl = window.location.href;
        navigator.clipboard.writeText(currentUrl).then(() => {
          alert("Tautan berita berhasil disalin ke papan klip (clipboard)!");
        });
      }
    </script>
  </body>
</html>
