<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Open Graph Meta Tags untuk Preview saat Dibagikan -->
  <title id="metaTitle">Detail Berita - krs.info</title>
  <meta property="og:title" id="ogTitle" content="Detail Berita - krs.info">
  <meta property="og:description" id="ogDesc" content="Baca berita dan informasi terkini dari krs.info">
  <meta property="og:image" id="ogImage" content="">
  <meta property="og:url" id="ogUrl" content="">
  <meta property="og:type" content="article">

  <!-- Font & Icon -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-red: #dc2626;
      --primary-dark: #b91c1c;
      --bg-light: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #8b0000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-main);
      line-height: 1.7;
      padding-top: 100px;
    }

    /* NAVBAR WRAPPER & LOGIKA SCROLL */
    .nav-wrapper {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 1000;
      transition: all 0.3s ease;
    }

    .nav-wrapper.scrolled {
      top: 0;
      left: 0;
      right: 0;
    }

    .navbar {
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: 50px;
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      transition: all 0.3s ease;
      position: relative;
    }

    .nav-wrapper.scrolled .navbar {
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-top: none;
      max-width: 100%;
      padding: 12px 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .nav-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Logo Beranda + Animasi Kilap (Shimmer Effect) */
    .nav-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
    }

    .nav-logo img {
      height: 32px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .nav-logo::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -75%;
      width: 50%;
      height: 200%;
      background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.6) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      animation: shine 3s infinite ease-in-out;
    }

    @keyframes shine {
      0% { left: -75%; }
      20% { left: 125%; }
      100% { left: 125%; }
    }

    /* Menu Navigasi Desktop */
    .nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
      list-style: none;
    }

    .nav-links li a {
      text-decoration: none;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      transition: color 0.2s;
    }

    .nav-links li a:hover {
      color: var(--primary-red);
    }

    /* Tombol Kirim Berita */
    .btn-kirim {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      color: #ffffff !important;
      padding: 8px 20px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
      cursor: pointer;
    }

    /* Tombol Hamburger di Navbar */
    .hamburger-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--primary-red) !important;
      cursor: pointer;
      padding: 4px;
      z-index: 1002;
    }

    /* OVERLAY GELAP DI LUAR PANEL */
    .mobile-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(15, 23, 42, 0.5);
      z-index: 1098;
      backdrop-filter: blur(2px);
    }

    /* SIDEBAR HAMBURGER */
    .mobile-menu-drawer {
      display: none;
      position: fixed;
      top: 20px;
      right: 20px;
      width: 300px;
      max-width: 85vw;
      height: calc(100vh - 40px);
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 24px 20px;
      flex-direction: column;
      gap: 16px;
      z-index: 1099;
      box-shadow: -10px 10px 30px rgba(0,0,0,0.15);
      overflow-y: auto;
      animation: slideInDropdown 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .nav-wrapper.scrolled ~ .mobile-backdrop + .mobile-menu-drawer,
    body.menu-open .nav-wrapper.scrolled ~ .mobile-menu-drawer {
      top: 0;
      right: 0;
      height: 100vh;
      border-radius: 0;
      border-top: none;
      border-right: none;
      border-bottom: none;
    }

    @keyframes slideInDropdown {
      from { opacity: 0; transform: translateY(-10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .drawer-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 5px;
    }

    .drawer-close-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--primary-red);
      cursor: pointer;
      padding: 4px;
    }

    .mobile-menu-drawer a.menu-item {
      text-decoration: none;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      padding-bottom: 14px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mobile-menu-drawer a.menu-item:hover {
      color: var(--primary-red);
    }

    .mobile-menu-drawer .btn-kirim-mobile {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      color: #ffffff !important;
      padding: 12px 20px;
      border-radius: 20px;
      text-align: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
      border-bottom: none;
      margin-top: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    /* KONTEN UTAMA ARTIKEL */
    .article-container {
      max-width: 850px;
      margin: 20px auto 80px auto;
      padding: 0 20px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 20px;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: var(--primary-red);
    }

    .article-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 15px;
    }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e2e8f0;
    }

    .article-meta span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .article-image-wrapper {
      width: 100%;
      max-height: 450px;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 35px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      background-color: #fee2e2;
    }

    .article-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .article-body-content {
      font-size: 1.05rem;
      color: #334155;
      line-height: 1.8;
      margin-bottom: 40px;
    }

    .article-body-content p {
      margin-bottom: 20px;
    }

    /* BAGIAN TOMBOL SHARE */
    .share-section {
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }

    .share-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .share-buttons-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .share-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .btn-whatsapp { background-color: #25d366; }
    .btn-facebook { background-color: #1877f2; }
    .btn-instagram { background-color: #e1306c; }

    /* MODAL PERSETUJUAN PAS DI TENGAH LAYAR */
    div[id*="modal"], 
    #modalProtokol, 
    .modal-protokol-overlay, 
    .modal-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background-color: rgba(15, 23, 42, 0.75) !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      z-index: 99999 !important;
      margin: 0 !important;
      padding: 20px !important;
      box-sizing: border-box !important;
      transform: none !important;
    }

    div[id*="modal"] > div, 
    #modalProtokol > div, 
    .modal-protokol-box, 
    .modal-content {
      position: relative !important;
      margin: auto !important;
      top: auto !important;
      left: auto !important;
      right: auto !important;
      bottom: auto !important;
      max-height: 85vh !important;
      max-width: 500px !important;
      width: 100% !important;
      overflow-y: auto !important;
      transform: none !important;
      background: #ffffff !important;
      border-radius: 16px !important;
      box-shadow: 0 25px 50px rgba(0,0,0,0.35) !important;
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger-btn { display: block; }
      .article-title { font-size: 1.7rem; }
      .article-image-wrapper { max-height: 260px; }
      .share-buttons-grid { flex-direction: column; }
      .share-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR UTAMA -->
  <div class="nav-wrapper" id="navbarWrapper">
    <nav class="navbar" id="mainNav">
      <div class="nav-container">
        <a href="index.html" class="nav-logo"> 
          <img src="krs.png" alt="Logo" /> 
        </a>
        
        <ul class="nav-links" id="menu">
          <li><a href="index.html#home">BERANDA</a></li>
          <li><a href="index.html#Berita">BERITA</a></li>
          <li><a href="index.html#agenda">AGENDA</a></li>
          <li><a href="index.html#kontak">KONTAK</a></li>
          <li>
            <a href="javascript:void(0);" onclick="bukaModalProtokol('https://forms.gle/dTcjsJgK8dRCVYjZA')" class="btn-kirim">
              <i class="fa-solid fa-paper-plane"></i> KIRIM BERITA
            </a>
          </li>
        </ul>

        <!-- Tombol Hamburger Mobile -->
        <button class="hamburger-btn" id="hamburgerToggle" aria-label="Menu">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </nav>
  </div>

  <!-- Backdrop Gelap -->
  <div class="mobile-backdrop" id="mobileBackdrop"></div>

  <!-- Sidebar Menu Hamburger -->
  <div class="mobile-menu-drawer" id="mobileMenu">
    <div class="drawer-header">
      <button class="drawer-close-btn" id="drawerCloseBtn" aria-label="Tutup Menu">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <a href="index.html#home" class="menu-item">BERANDA <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem; color: #94a3b8;"></i></a>
    <a href="index.html#Berita" class="menu-item">BERITA <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem; color: #94a3b8;"></i></a>
    <a href="index.html#agenda" class="menu-item">AGENDA <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem; color: #94a3b8;"></i></a>
    <a href="index.html#kontak" class="menu-item">KONTAK <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem; color: #94a3b8;"></i></a>
    
    <!-- Tombol Kirim Berita versi Mobile (Menutup menu & Buka Modal) -->
    <a href="javascript:void(0);" onclick="closeMenu(); bukaModalProtokol('https://forms.gle/dTcjsJgK8dRCVYjZA');" class="btn-kirim-mobile">
      <i class="fa-solid fa-paper-plane"></i> KIRIM BERITA
    </a>
  </div>

  <!-- KONTEN DINAMIS -->
  <main class="article-container" id="articleContentWrapper">
    <a href="index.html#Berita" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> Kembali ke Berita
    </a>

    <div style="text-align:center; padding: 60px 0; color: #64748b;">
      Memuat detail berita...
    </div>
  </main>

  <!-- Panggil Database Berita & Script Persetujuan Modal -->
  <script src="berita-data.js"></script>
  <script src="persetujuan.js"></script>

  <!-- SCRIPT LOGIKA -->
  <script>
    // 1. Logika Scroll Navbar (Sticky & Morphing)
    window.addEventListener('scroll', function() {
      const navWrapper = document.getElementById('navbarWrapper');
      if (window.scrollY > 30) {
        navWrapper.classList.add('scrolled');
      } else {
        navWrapper.classList.remove('scrolled');
      }
    });

    // 2. Logika Sidebar Menu Mobile
    const hamburgerToggle = document.getElementById('hamburgerToggle');
    const mobileMenu = document.getElementById('mobileMenu');
    const mobileBackdrop = document.getElementById('mobileBackdrop');
    const drawerCloseBtn = document.getElementById('drawerCloseBtn');

    function openMenu() {
      mobileMenu.style.display = 'flex';
      mobileBackdrop.style.display = 'block';
      document.body.classList.add('menu-open');
    }

    function closeMenu() {
      mobileMenu.style.display = 'none';
      mobileBackdrop.style.display = 'none';
      document.body.classList.remove('menu-open');
    }

    hamburgerToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      if (mobileMenu.style.display === 'flex') {
        closeMenu();
      } else {
        openMenu();
      }
    });

    drawerCloseBtn.addEventListener('click', closeMenu);
    mobileBackdrop.addEventListener('click', closeMenu);

    // Otomatis tutup menu jika link menu biasa diklik
    const menuLinks = mobileMenu.querySelectorAll('a.menu-item');
    menuLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // 3. Logika Pemanggilan Data Berita dan Format Share Profesional
    document.addEventListener("DOMContentLoaded", function() {
      const urlParams = new URLSearchParams(window.location.search);
      const beritaId = urlParams.get('id');

      const container = document.getElementById('articleContentWrapper');

      if (typeof DATABASE_BERITA !== 'undefined' && beritaId) {
        const berita = DATABASE_BERITA.find(item => item.id == beritaId);

        if (berita) {
          document.getElementById('metaTitle').innerText = `${berita.judul} - krs.info`;
          document.getElementById('ogTitle').setAttribute('content', berita.judul);
          document.getElementById('ogDesc').setAttribute('content', berita.ringkasan);
          document.getElementById('ogImage').setAttribute('content', window.location.origin + '/' + berita.gambar);
          document.getElementById('ogUrl').setAttribute('content', window.location.href);

          const isiKronologi = berita.isi || berita.kronologi || berita.deskripsi || "<p>Belum ada isi kronologi untuk berita ini.</p>";
          const tanggalRilis = berita.tanggalRilis || berita.tanggal || "Terbaru";

          // Format Teks Share Profesional (Judul, Ringkasan, Tentang Platform, Link Web, Sosmed, & Link Berita)
          const shareMessage = `📢 *${berita.judul}*\n\n` +
            `"${berita.ringkasan}"\n\n` +
            `-----------------------------------\n` +
            `💡 *Tentang krs.info*\n` +
            `krs.info merupakan bagian dari platform media lokal terpercaya yang menyajikan informasi, berita, dan agenda terkini.\n\n` +
            `🔗 *Akses Website Resmi Kami:*\n` +
            `https://karangsariweru.my.id\n\n` +
            `📱 *Ikuti & Dukung Kami di Sosial Media:*\n` +
            `• Instagram: @krs.info\n` +
            `• TikTok: @krs.info\n` +
            `-----------------------------------\n\n` +
            `👉 *Baca berita lengkapnya di sini:*\n` + 
            window.location.href;

          container.innerHTML = `
            <a href="index.html#Berita" class="back-btn">
              <i class="fa-solid fa-arrow-left"></i> Kembali ke Berita
            </a>

            <h1 class="article-title">${berita.judul}</h1>
            
            <div class="article-meta">
              <span><i class="fa-regular fa-calendar"></i> ${tanggalRilis}</span>
              <span><i class="fa-solid fa-tag"></i> ${berita.kategori}</span>
            </div>

            <div class="article-image-wrapper">
              <img src="${berita.gambar}" alt="${berita.judul}">
            </div>

            <div class="article-body-content">
              ${isiKronologi}
            </div>

            <div class="share-section">
              <div class="share-title">
                <i class="fa-solid fa-share-nodes"></i> Bagikan Berita Ini
              </div>
              <div class="share-buttons-grid">
                <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(shareMessage)}" target="_blank" class="share-btn btn-whatsapp">
                  <i class="fa-brands fa-whatsapp"></i> WhatsApp
                </a>
                <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" target="_blank" class="share-btn btn-facebook">
                  <i class="fa-brands fa-facebook-f"></i> Facebook
                </a>
                <a href="https://api.whatsapp.com/send?text=${encodeURIComponent("Halo! Yuk simak informasi menarik ini:\n\n" + shareMessage)}" target="_blank" class="share-btn btn-instagram">
                  <i class="fa-brands fa-instagram"></i> Instagram
                </a>
              </div>
            </div>
          `;
        } else {
          container.innerHTML = `
            <a href="index.html#SemuaBerita" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali ke Berita</a>
            <div style="text-align:center; padding: 60px 0; color: #dc2626;">Berita yang kamu cari tidak ditemukan.</div>
          `;
        }
      } else {
        container.innerHTML = `
          <a href="index.html#Berita" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali ke Berita</a>
          <div style="text-align:center; padding: 60px 0; color: #dc2626;">ID Berita tidak valid.</div>
        `;
      }
    });
  </script>

</body>
</html>
