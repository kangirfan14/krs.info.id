<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="krsduwur.png" />
<link rel="icon" type="image/png" href="krsduwur.png" />
    <!-- Open Graph Meta Tags untuk Preview saat Dibagikan -->
    <title id="metaTitle">Berita | #karangsarineweru</title>
    <meta property="og:title" id="ogTitle" content="Detail Berita - krs.info" />
    <meta
      property="og:description"
      id="ogDesc"
      content="Baca berita dan informasi terkini dari krs.info"
    />
    <meta property="og:image" id="ogImage" content="" />
    <meta property="og:url" id="ogUrl" content="" />
    <meta property="og:type" content="article" />

    <!-- Font & Icon -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --primary-red: #dc2626;
        --primary-dark: #b91c1c;
        --bg-light: #f8fafc;
        --text-main: #0f172a;
        --text-muted: #475569;
        --border-color: #8b0000;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: var(--bg-light);
        color: var(--text-main);
        line-height: 1.7;
        padding-top: 100px;
      }

      /* OVERLAY GELAP DI LUAR PANEL */
      .mobile-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(15, 23, 42, 0.5);
        z-index: 1098;
        backdrop-filter: blur(2px);
      }

      /* KONTEN UTAMA ARTIKEL */
      .article-container {
        max-width: 850px;
        margin: 20px auto 80px auto;
        padding: 0 20px;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 700;
        font-size: 0.9rem;
        margin-bottom: 20px;
        transition: color 0.2s;
      }

      .back-btn:hover {
        color: var(--primary-red);
      }

      .article-title {
        font-size: 2.2rem;
        font-weight: 900;
        color: var(--text-main);
        line-height: 1.3;
        margin-bottom: 15px;
      }

      .article-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: center;
        font-size: 0.9rem;
        color: var(--text-muted);
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 1px solid #e2e8f0;
      }

      .article-meta span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .article-image-wrapper {
        width: 100%;
        max-height: 450px;
        border-radius: 14px;
        overflow: hidden;
        margin-bottom: 35px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        background-color: #fee2e2;
      }

      .article-image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .article-body-content {
        font-size: 1.05rem;
        color: #334155;
        line-height: 1.8;
        margin-bottom: 40px;
      }

      .article-body-content p {
        margin-bottom: 20px;
      }

      /* BAGIAN TOMBOL SHARE */
      .share-section {
        background: #ffffff;
        padding: 24px;
        border-radius: 14px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
      }

      .share-title {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .share-buttons-grid {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .share-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 0.88rem;
        font-weight: 600;
        color: #ffffff;
        text-decoration: none;
        transition: opacity 0.2s, transform 0.2s;
      }

      .share-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
      }

      .btn-whatsapp { background-color: #25d366; }
      .btn-facebook { background-color: #1877f2; }
      .btn-instagram { background-color: #e1306c; }

      /* STYLING MODAL PROTOKOL KIRIM BERITA */
      .modal-17an-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        padding: 15px;
        box-sizing: border-box;
      }

      .protocol-box {
        background: #ffffff; border-radius: 16px;
        max-width: 550px; width: 100%; max-height: 90vh;
        display: flex; flex-direction: column; overflow: hidden; position: relative;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        animation: popInLegal 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .protocol-header {
        background: #1e293b; color: #ffffff; padding: 16px 20px;
        display: flex; align-items: center; justify-content: space-between;
        border-bottom: 3px solid #d32f2f;
      }
      .protocol-header h4 { margin: 0; font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
      
      .protocol-body {
        padding: 20px; overflow-y: auto; flex: 1; text-align: left;
        font-size: 0.85rem; color: #334155; line-height: 1.6;
      }
      
      .protocol-content-text {
        background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px;
        padding: 16px; max-height: 260px; overflow-y: auto;
      }

      .protocol-footer {
        padding: 16px 20px; background: #ffffff; border-top: 1px solid #e2e8f0;
        display: flex; gap: 10px; justify-content: flex-end;
      }
      .btn-cancel-proto {
        background: #e2e8f0; color: #475569; border: none; padding: 10px 18px;
        border-radius: 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
      }
      .btn-proceed-proto {
        background: linear-gradient(135deg, #d32f2f 0%, #9a0007 100%);
        color: #ffffff; border: none; padding: 10px 20px; border-radius: 10px;
        font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex;
        align-items: center; gap: 8px; text-decoration: none;
      }
      @keyframes popInLegal { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

      @media (max-width: 768px) {
        .article-title { font-size: 1.7rem; }
        .article-image-wrapper { max-height: 260px; }
        .share-buttons-grid { flex-direction: column; }
        .share-btn { width: 100%; justify-content: center; }
      }
    </style>
  </head>
  <body>
    <!-- 1. PENAMPUNG NAVBAR OTOMATIS -->
    <div id="navbar-placeholder"></div>

    <!-- 2. SKRIP PEMANGGIL NAVBAR & INISIALISASI HAMBURGER -->
    <script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
                
                // Pasang event listener untuk tombol hamburger setelah navbar dimuat
                const hamburger = document.getElementById('hamburger');
                const menu = document.getElementById('menu');

                if (hamburger && menu) {
                    hamburger.addEventListener('click', function(e) {
                        e.stopPropagation();
                        menu.classList.toggle('active');
                    });
                }
            })
            .catch(error => console.error('Gagal memuat navbar:', error));

        // Tutup menu saat mengklik di luar area navbar
        document.addEventListener('click', function(event) {
            const navbar = document.getElementById('mainNav');
            const menu = document.getElementById('menu');
            if (navbar && menu && !navbar.contains(event.target)) {
                menu.classList.remove('active');
            }
        });

        // FUNGSI GLOBAL KIRIM BERITA & MODAL (Agar bisa dipanggil dari navbar yang di-fetch)
        function handleKirimBerita(targetUrl) {
            const menu = document.getElementById('menu');
            if (menu) {
                menu.classList.remove('active');
            }
            bukaModalProtokol(targetUrl);
        }

        function bukaModalProtokol(url) {
            const existingModal = document.getElementById('protocolModal');
            if (existingModal) existingModal.remove();

            const modalOverlay = document.createElement('div');
            modalOverlay.id = 'protocolModal';
            modalOverlay.className = 'modal-17an-overlay';

            modalOverlay.innerHTML = `
                <div class="protocol-box">
                    <div class="protocol-header">
                        <h4><i class="fa-solid fa-triangle-exclamation"></i> Protokol Pengiriman Berita</h4>
                    </div>
                    <div class="protocol-body">
                        <div class="protocol-content-text">
                            <h5>Ketentuan Layanan & Publikasi</h5>
                            <p>Dengan melanjutkan ke lembar formulir pengiriman berita KRS.info, Anda menyetujui seluruh ketentuan dan kode etik jurnalistik warga yang berlaku di wilayah Karangsari.</p>
                            <h5>Kebijakan Data</h5>
                            <p>Pastikan informasi, foto, atau video yang dikirimkan dapat dipertanggungjawabkan kebenarannya dan tidak mengandung unsur SARA.</p>
                        </div>
                    </div>
                    <div class="protocol-footer">
                        <button type="button" class="btn-cancel-proto" onclick="document.getElementById('protocolModal').remove()">Batal</button>
                        <a href="${url}" target="_blank" class="btn-proceed-proto" onclick="document.getElementById('protocolModal').remove()">
                            Setuju & Lanjutkan <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            `;

            document.body.appendChild(modalOverlay);
        }
    </script>

    <!-- KONTEN UTAMA ARTIKEL -->
    <main class="article-container" id="articleContentWrapper">
      <a href="index.html#Berita" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Berita
      </a>

      <div style="text-align: center; padding: 60px 0; color: #64748b">
        Memuat detail berita...
      </div>
    </main>

    <!-- Panggil Database Berita -->
    <script src="berita-data.js"></script>
    
    <!-- SCRIPT LOGIKA DETAIL BERITA -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const urlParams = new URLSearchParams(window.location.search);
        const beritaId = urlParams.get("id");

        const container = document.getElementById("articleContentWrapper");

        if (typeof DATABASE_BERITA !== "undefined" && beritaId) {
          const berita = DATABASE_BERITA.find((item) => item.id == beritaId);

          if (berita) {
            document.getElementById("metaTitle").innerText = `${berita.judul} - krs.info`;
            document.getElementById("ogTitle").setAttribute("content", berita.judul);
            document.getElementById("ogDesc").setAttribute("content", berita.ringkasan);
            document.getElementById("ogImage").setAttribute("content", window.location.origin + "/" + berita.gambar);
            document.getElementById("ogUrl").setAttribute("content", window.location.href);

            const isiKronologi = berita.isi || berita.kronologi || berita.deskripsi || "<p>Belum ada isi kronologi untuk berita ini.</p>";
            const tanggalRilis = berita.tanggalRilis || berita.tanggal || "Terbaru";

            const shareMessage =
              `📢 *${berita.judul}*\n\n` +
              `"${berita.ringkasan}"\n\n` +
              `-----------------------------------\n` +
              `💡 *Tentang krs.info*\n` +
              `krs.info merupakan bagian dari platform media lokal terpercaya yang menyajikan informasi, berita, dan agenda terkini.\n\n` +
              `🔗 *Akses Website Resmi Kami:*\n` +
              `https://karangsariweru.my.id\n\n` +
              `📱 *Ikuti & Dukung Kami di Sosial Media:*\n` +
              `• Instagram: @krs.info\n` +
              `• TikTok: @krs.info\n` +
              `-----------------------------------\n\n` +
              `👉 *Baca berita lengkapnya di sini:*\n` +
              window.location.href;

            container.innerHTML = `
              <a href="index.html#Berita" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Berita
              </a>

              <h1 class="article-title">${berita.judul}</h1>
              
              <div class="article-meta">
                <span><i class="fa-regular fa-calendar"></i> ${tanggalRilis}</span>
                <span><i class="fa-solid fa-tag"></i> ${berita.kategori}</span>
              </div>

              <div class="article-image-wrapper">
                <img src="${berita.gambar}" alt="${berita.judul}">
              </div>

              <div class="article-body-content">
                ${isiKronologi}
              </div>

              <div class="share-section">
                <div class="share-title">
                  <i class="fa-solid fa-share-nodes"></i> Bagikan Berita Ini
                </div>
                <div class="share-buttons-grid">
                  <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(shareMessage)}" target="_blank" class="share-btn btn-whatsapp">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                  </a>
                  <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" target="_blank" class="share-btn btn-facebook">
                    <i class="fa-brands fa-facebook-f"></i> Facebook
                  </a>
                  <a href="https://api.whatsapp.com/send?text=${encodeURIComponent("Halo! Yuk simak informasi menarik ini:\n\n" + shareMessage)}" target="_blank" class="share-btn btn-instagram">
                    <i class="fa-brands fa-instagram"></i> Instagram
                  </a>
                </div>
              </div>
            `;
          } else {
            container.innerHTML = `
              <a href="index.html#Berita" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali ke Berita</a>
              <div style="text-align:center; padding: 60px 0; color: #dc2626;">Berita yang kamu cari tidak ditemukan.</div>
            `;
          }
        } else {
          container.innerHTML = `
            <a href="index.html#Berita" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali ke Berita</a>
            <div style="text-align:center; padding: 60px 0; color: #dc2626;">ID Berita tidak valid.</div>
          `;
        }
      });
    </script>

    <!-- Penampung Footer Otomatis -->
    <div id="footer-placeholder"></div>

    <!-- Script untuk Memuat Footer -->
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
    <!-- Panggil Database Berita & Script Persetujuan Modal -->
    <script src="berita-data.js"></script>
    <script src="persetujuan.js"></script> <!-- <-- Pastikan baris ini ada agar modal dari persetujuan.js aktif -->
    
    <!-- SCRIPT LOGIKA DETAIL BERITA -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // ... (kode logika berita Anda tetap sama)
      });
    </script>

    <!-- Penampung Footer Otomatis -->
    <div id="footer-placeholder"></div>

    <!-- Script untuk Memuat Footer -->
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
</body>
</html>
