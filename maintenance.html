<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemeliharaan Sistem</title>
    <!-- Menggunakan font formal standar yang bersih -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .maintenance-container {
            max-width: 520px;
            width: 100%;
            text-align: center;
            background: #ffffff;
            padding: 48px 36px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
        }

        /* Animasi Roda Gerigi Berputar */
        .icon-box {
            width: 64px;
            height: 64px;
            background: #f1f5f9;
            color: #475569;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 24px auto;
        }

        .icon-box i {
            animation: spinGear 6s linear infinite;
        }

        @keyframes spinGear {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 0.95rem;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Kotak Hitung Mundur Formal */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 28px;
        }

        .countdown-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
        }

        .countdown-number {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 2px;
        }

        .countdown-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .target-info {
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.875rem;
            color: #334155;
            font-weight: 500;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .target-info i {
            color: #64748b;
        }

        .footer-note {
            font-size: 0.8rem;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
        }

        /* Responsif untuk Mobile agar tidak ada bug layout */
        @media screen and (max-width: 480px) {
            .maintenance-container {
                padding: 36px 20px;
            }
            h1 {
                font-size: 1.35rem;
            }
            .countdown-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <div class="icon-box">
            <i class="fa-solid fa-gear"></i>
        </div>
        
        <h1>Website Sedang Dalam Pengembangan</h1>
        <p>Mohon maaf atas ketidaknyamanan ini. Saat ini kami sedang melakukan peningkatan sistem dan pembaruan data untuk mengoptimalkan layanan.</p>

        <div class="target-info">
            <i class="fa-regular fa-clock"></i> Web Dapat Di Akses Kembali : <strong>01 November 2026</strong>
        </div>

        <!-- Hitung Mundur -->
        <div class="countdown-grid">
            <div class="countdown-box">
                <div class="countdown-number" id="days">00</div>
                <div class="countdown-label">Hari</div>
            </div>
            <div class="countdown-box">
                <div class="countdown-number" id="hours">00</div>
                <div class="countdown-label">Jam</div>
            </div>
            <div class="countdown-box">
                <div class="countdown-number" id="minutes">00</div>
                <div class="countdown-label">Menit</div>
            </div>
            <div class="countdown-box">
                <div class="countdown-number" id="seconds">00</div>
                <div class="countdown-label">Detik</div>
            </div>
        </div>

        <div class="footer-note">
            &copy; 2026 #karangsarineweru. All rights reserved.
        </div>
    </div>

    <script>
        const targetDate = new Date("2026-11-01T00:00:00").getTime();

        const countdownInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                clearInterval(countdownInterval);
                localStorage.setItem("maintenance_active", "false");
                window.location.href = "index.html";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
