<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar KRS.info</title>
    <!-- FontAwesome untuk ikon hamburger dan pesawat -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
  /* Navbar Utama - Terkunci Presisi di Tengah Atas */
  .navbar {
    position: fixed !important;
    top: 15px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    z-index: 99999 !important;
    background-color: #ffffff !important;
    width: 92% !important;
    max-width: 1200px !important;
    border: 2px solid #800000 !important;
    border-radius: 50px !important;
    padding: 10px 20px !important;
    box-sizing: border-box !important;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06) !important;
  }

  .nav-container {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    position: relative !important;
    width: 100% !important;
  }

  /* Logo & Efek Kilau (Shimmer) */
  .nav-logo {
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .logo-shine-wrapper {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    border-radius: 6px;
  }

  .logo-shine-wrapper img {
    height: 30px;
    width: auto;
    object-fit: contain;
    display: block;
  }

  .logo-shine-wrapper::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -150%;
    width: 50%;
    height: 200%;
    background: linear-gradient(
      to right,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.6) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    transform: rotate(30deg);
    animation: logoShimmer 3s infinite ease-in-out;
  }

  @keyframes logoShimmer {
    0% { left: -150%; }
    20% { left: 150%; }
    100% { left: 150%; }
  }

  /* Tampilan Menu (Desktop Default) */
  .nav-links {
    display: flex;
    list-style: none;
    gap: 8px;
    margin: 0;
    padding: 0;
    align-items: center;
  }

  .nav-links li a:not(.btn-kirim) {
    text-decoration: none;
    color: #0b192c;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 50px;
    border: 2px solid transparent;
    transition: all 0.2s ease-in-out;
    display: inline-block;
  }

  .nav-links li a.active:not(.btn-kirim) {
    border-color: #800000 !important;
    color: #800000 !important;
  }

  .btn-kirim {
    background: linear-gradient(135deg, #800000, #1a0000) !important;
    color: #ffffff !important;
    padding: 8px 18px !important;
    border-radius: 50px !important;
    text-decoration: none !important;
    font-weight: 600 !important;
    font-size: 13px !important;
    box-shadow: 0 4px 10px rgba(128, 0, 0, 0.2) !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
  }

  /* Tombol Hamburger */
  .hamburger {
    display: none !important;
    background: none;
    border: none;
    color: #800000;
    font-size: 20px;
    cursor: pointer;
    padding: 4px;
  }

  /* ==================== RESPONSIF MOBILE (< 768px) ==================== */
  @media screen and (max-width: 768px) {
    .navbar {
      width: 90% !important;
      padding: 8px 16px !important;
      border-radius: 35px !important;
    }

    .hamburger {
      display: block !important;
    }

    /* Menu Dropdown Mobile Rapi, Presisi di Bawah Kapsul Navbar */
    .nav-links {
      position: absolute !important;
      top: calc(100% + 12px) !important;
      right: 0 !important;
      left: auto !important;
      width: 220px !important;
      background-color: #ffffff !important;
      flex-direction: column !important;
      align-items: stretch !important;
      padding: 14px !important;
      border: 2px solid #800000 !important;
      border-radius: 18px !important;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15) !important;
      
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      gap: 8px !important;
      box-sizing: border-box !important;
      z-index: 999999 !important;
    }

    .nav-links.active {
      opacity: 1 !important;
      visibility: visible !important;
      transform: translateY(0) !important;
    }

    .nav-links li {
      width: 100%;
      margin: 0;
    }

    .nav-links li a:not(.btn-kirim) {
      width: 100%;
      display: block;
      padding: 9px 12px;
      font-size: 13px !important;
      color: #0b192c;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .nav-links li a:not(.btn-kirim):hover {
      background: rgba(128, 0, 0, 0.05);
      color: #800000;
    }

    .btn-kirim {
      width: 100% !important;
      justify-content: center !important;
      margin-top: 4px !important;
      padding: 10px 16px !important;
      box-sizing: border-box !important;
    }
  }
</style>
</head>
<body>

    <nav class="navbar" id="mainNav">
        <div class="nav-container">
            <!-- Logo dengan Efek Kilau (Shimmer) -->
            <a href="index.html" class="nav-logo">
                <div class="logo-shine-wrapper">
                    <img src="krs.png" alt="Logo KRS.info" />
                </div>
            </a>

            <ul class="nav-links" id="menu">
                <li><a href="index.html#home">Beranda</a></li>
                <li><a href="index.html#Berita">Berita</a></li>
                <li><a href="index.html#agenda">Acara</a></li>
                <li><a href="index.html#kuis">Kuis</a></li>
                <li>
                    <a href="javascript:void(0);" onclick="handleKirimBerita('kirim-berita.html')" class="btn-kirim">
                        <i class="fa-solid fa-paper-plane"></i> Kirim Berita
                    </a>
                </li>
            </ul>
            
            <!-- Tombol Hamburger -->
            <button class="hamburger" id="hamburger" aria-label="Toggle Menu" type="button">
                <i class="fa-solid fa-bars-staggered"></i>
            </button>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const hamburger = document.getElementById('hamburger');
            const menu = document.getElementById('menu');

            if (hamburger && menu) {
                hamburger.addEventListener('click', function(e) {
                    e.stopPropagation();
                    menu.classList.toggle('active');
                });
            }

            document.addEventListener('click', function(event) {
                const navbar = document.getElementById('mainNav');
                if (navbar && menu && !navbar.contains(event.target)) {
                    menu.classList.remove('active');
                }
            });
        });

        function handleKirimBerita(targetUrl) {
            const menu = document.getElementById('menu');
            if (menu) {
                menu.classList.remove('active');
            }
            bukaModalProtokol(targetUrl);
        }

        function bukaModalProtokol(url) {
            const existingModal = document.getElementById('protocolModal');
            if (existingModal) existingModal.remove();

            const modalOverlay = document.createElement('div');
            modalOverlay.id = 'protocolModal';
            modalOverlay.className = 'modal-17an-overlay';

            modalOverlay.innerHTML = `
                <div class="protocol-box">
                    <div class="protocol-header">
                        <h4><i class="fa-solid fa-triangle-exclamation"></i> Protokol Pengiriman Berita</h4>
                    </div>
                    <div class="protocol-body">
                        <div class="protocol-content-text">
                            <h5>Ketentuan Layanan & Publikasi</h5>
                            <p>Dengan melanjutkan ke lembar formulir pengiriman berita KRS.info, Anda menyetujui seluruh ketentuan dan kode etik jurnalistik warga yang berlaku di wilayah Karangsari.</p>
                            <h5>Kebijakan Data</h5>
                            <p>Pastikan informasi, foto, atau video yang dikirimkan dapat dipertanggungjawabkan kebenarannya dan tidak mengandung unsur SARA.</p>
                        </div>
                    </div>
                    <div class="protocol-footer">
                        <button type="button" class="btn-cancel-proto" onclick="document.getElementById('protocolModal').remove()">Batal</button>
                        <a href="${url}" target="_blank" class="btn-proceed-proto" onclick="document.getElementById('protocolModal').remove()">
                            Setuju & Lanjutkan <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            `;

            document.body.appendChild(modalOverlay);
        }
    </script>
</body>
</html>
