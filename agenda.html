<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="krsduwur.png" />
   <title>Acara  | #karangsarineweru</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-surface: #f8fafc;
            --border-glass: #800000;
            --border-light: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-red: #dc2626;
            --accent-gradient: linear-gradient(135deg, #7f1d1d 0%, #000000 100%);
            --accent-glow: rgba(127, 29, 29, 0.25);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            padding-top: 100px;
        }

        /* --- NAVBAR UTAMA --- */
        .nav-wrapper {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 92%;
            max-width: 1150px;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid var(--border-glass);
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(128, 0, 0, 0.08);
            padding: 0 24px;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 65px;
            position: relative;
        }

        .nav-logo {
            position: relative;
            overflow: hidden;
            display: inline-block;
            text-decoration: none;
        }

        .nav-logo img {
            height: 32px;
            width: auto;
            display: block;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(200%) rotate(30deg); }
        }

        .nav-logo::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.6) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: translateX(-100%) rotate(30deg);
            animation: shine 3s infinite;
            pointer-events: none;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
            margin: 0;
            padding: 0;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            transition: color 0.2s;
        }

        .nav-links a.active, .nav-links a:hover {
            color: var(--accent-red);
        }

        .btn-kirim {
            background: var(--accent-gradient) !important;
            color: #ffffff !important;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px var(--accent-glow);
            transition: all 0.2s ease !important;
        }

        .btn-kirim:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(127, 29, 29, 0.35);
        }

        .hamburger-btn {
            display: none;
            background: none;
            border: none;
            color: var(--accent-red);
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
        }

        /* --- CONTAINER UTAMA AGENDA --- */
        .agenda-container {
            max-width: 1100px;
            margin: 20px auto 50px auto;
            padding: 0 20px;
        }

        .agenda-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .agenda-header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .agenda-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .agenda-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            align-items: start;
        }

        /* Filter Section */
        .agenda-filters {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }

        .filter-group {
            margin-bottom: 14px;
        }

        .filter-group:last-child {
            margin-bottom: 0;
        }

        .filter-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid var(--border-light);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-gradient);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .year-select-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .year-select {
            flex: 1;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-light);
            background: #ffffff;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
        }

        .btn-reload-acara {
            background: #ffffff;
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-reload-acara:hover {
            background: #f1f5f9;
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .btn-reload-acara i {
            transition: transform 0.4s ease;
        }

        .btn-reload-acara:active i {
            transform: rotate(360deg);
        }

        /* Kalender Interaktif */
        .calendar-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
        }

        .calendar-header button {
            background: #ffffff;
            border: 1px solid var(--border-light);
            cursor: pointer;
            font-size: 12px;
            color: var(--text-main);
            padding: 5px 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .calendar-header button:hover {
            background: var(--accent-red);
            color: #ffffff;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            text-align: center;
        }

        .calendar-day-name {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            padding-bottom: 4px;
        }

        .calendar-date {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            color: var(--text-main);
            transition: background 0.2s;
        }

        .calendar-date:hover {
            background: rgba(220, 38, 38, 0.1);
        }

        .calendar-date.active-event {
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: 0 3px 8px var(--accent-glow);
        }

        .calendar-date.active-event::after {
            content: '';
            position: absolute;
            bottom: 2px;
            width: 3px;
            height: 3px;
            background: #ffffff;
            border-radius: 50%;
        }

        /* --- KARTU AGENDA & POSTER --- */
        .agenda-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .agenda-item-card {
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 22px;
            align-items: start;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            position: relative;
        }

        .agenda-item-card:hover {
            transform: translateY(-3px);
            border-color: rgba(220, 38, 38, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }

        .agenda-poster-wrapper {
            width: 100%;
            aspect-ratio: 4 / 5;
            border-radius: 12px;
            overflow: hidden;
            background: #f1f5f9;
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .agenda-poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .agenda-item-card:hover .agenda-poster-wrapper img {
            transform: scale(1.04);
        }

        .agenda-content-box {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .agenda-info h3 {
            font-family: 'Syne', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--text-main);
            padding-right: 95px;
        }

        .agenda-date-loc {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .agenda-date-loc span i {
            margin-right: 5px;
            color: var(--accent-red);
        }

        .agenda-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0 0 16px 0;
            line-height: 1.5;
        }

        .agenda-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            background: var(--accent-gradient);
            padding: 9px 18px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--accent-glow);
            transition: all 0.2s ease;
            width: fit-content;
            border: none;
            cursor: pointer;
            margin-top: 5px;
        }

        .agenda-action-btn:hover {
            opacity: 0.9;
            box-shadow: 0 6px 16px rgba(127, 29, 29, 0.35);
            transform: translateY(-2px);
        }

        /* --- BADGE STATUS --- */
        .agenda-status-badge {
            position: absolute;
            top: 24px;
            right: 24px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .status-akan-datang { 
            background: rgba(16, 185, 129, 0.12); 
            color: #059669; 
            border: 1px solid rgba(16, 185, 129, 0.3); 
        }

        .status-selesai { 
            background: rgba(100, 116, 139, 0.12); 
            color: #475569; 
            border: 1px solid rgba(100, 116, 139, 0.3); 
        }

        .status-berlangsung { 
            background: rgba(249, 115, 22, 0.12); 
            color: #ea580c; 
            border: 1px solid rgba(249, 115, 22, 0.3); 
            animation: pulseGlow 1.8s infinite;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.4); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 6px rgba(249, 115, 22, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
        }

        .no-agenda {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid var(--border-light);
        }

        /* --- STYLING MOBILE --- */
        @media screen and (max-width: 768px) {
            body {
                padding-top: 90px;
            }
            .nav-wrapper {
                width: 92%;
                top: 12px;
            }
            .navbar {
                padding: 0 18px;
            }
            .hamburger-btn {
                display: block;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 75px;
                right: 0;
                width: 280px;
                background: #ffffff;
                flex-direction: column;
                align-items: stretch;
                padding: 22px 18px;
                gap: 12px;
                border: 2px solid var(--border-glass);
                border-radius: 24px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
                box-sizing: border-box;
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links li a {
                font-size: 15px;
                font-weight: 600;
                color: var(--text-main);
                padding: 10px 16px;
                display: block;
                border-radius: 12px;
                background: transparent !important;
            }

            .nav-links li a:hover, .nav-links li a.active {
                background: #f8fafc;
                color: var(--accent-red);
            }

            .nav-links .btn-kirim {
                text-align: center;
                margin-top: 6px;
                border-radius: 30px !important;
                padding: 12px 20px !important;
                background: var(--accent-gradient) !important;
                color: #ffffff !important;
            }

            .agenda-layout {
                grid-template-columns: 1fr;
            }

            .agenda-item-card {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                text-align: left;
                gap: 14px;
                padding: 18px;
            }

            .agenda-status-badge {
                position: relative;
                top: auto;
                right: auto;
                align-self: flex-start;
                margin-bottom: -4px;
            }

            .agenda-info {
                order: 2;
                width: 100%;
            }
            
            .agenda-info h3 {
                padding-right: 0;
                font-size: 1.1rem;
                margin-bottom: 0;
            }

            .agenda-poster-wrapper {
                order: 3;
                width: 100%;
                aspect-ratio: 1080 / 1350;
                margin: 0;
            }

            .agenda-date-loc {
                order: 4;
                justify-content: flex-start;
                flex-direction: column;
                gap: 6px;
                margin-bottom: 0;
                font-size: 12px;
                width: 100%;
            }

            .agenda-desc {
                order: 5;
                margin-bottom: 0;
                width: 100%;
            }

            .agenda-content-box {
                order: 6;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                width: 100%;
                height: auto;
                margin-top: 4px;
            }

            .agenda-action-btn {
                order: 7;
                width: 100%;
                justify-content: center;
                padding: 11px 20px;
                border-radius: 12px;
                box-sizing: border-box;
                margin-top: 10px;
            }
        }

        /* --- TOMBOL KEMBALI KE BERANDA --- */
        .back-to-home-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 15px 20px;
        }

        .back-to-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-red);
            text-decoration: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .back-to-home:hover {
            opacity: 0.85;
            transform: translateX(-3px);
        }

        @media screen and (max-width: 768px) {
            .back-to-home-wrapper {
                padding: 0 20px 10px 20px;
            }
        }
    </style>
</head>

    <script src="agenda-data.js"></script>
    <script src="persetujuan.js"></script>
    <script>
        // Fungsi terisolasi khusus untuk memposisikan modal persetujuan berita/protokol secara terpusat
        function forceCenterModal() {
            const allDivs = document.querySelectorAll('body > div');
            allDivs.forEach(div => {
                if (div && (div.innerHTML.includes('Lembar Wajib Dibaca') || div.innerHTML.includes('Protokoler') || div.id === 'modalProtokol' || (div.style.position === 'fixed' && !div.id.includes('krsDocModal')))) {
                    div.style.cssText = `
                        position: fixed !important;
                        top: 0 !important;
                        left: 0 !important;
                        width: 100vw !important;
                        height: 100vh !important;
                        background: rgba(0, 0, 0, 0.65) !important;
                        z-index: 99999 !important;
                        display: flex !important;
                        justify-content: center !important;
                        align-items: center !important;
                        padding: 15px !important;
                        box-sizing: border-box !important;
                        backdrop-filter: blur(8px) !important;
                        margin: 0 !important;
                        transform: none !important;
                    `;
                }
            });
        }

        function formatFriendlyDate(startStr, endStr) {
            const daysIndo = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const monthsIndo = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            
            try {
                const cleanStart = startStr.trim();
                const cleanEnd = endStr.trim();
                
                const dtStart = new Date(cleanStart.replace(' ', 'T'));
                const dtEnd = new Date(cleanEnd.replace(' ', 'T'));

                if (isNaN(dtStart.getTime())) {
                    return `${startStr} s/d ${endStr}`;
                }

                const dayName = daysIndo[dtStart.getDay()];
                const dayNum = dtStart.getDate();
                const monthName = monthsIndo[dtStart.getMonth()];
                const yearNum = dtStart.getFullYear();

                const startTime = cleanStart.includes(' ') ? cleanStart.split(' ')[1] : '';
                const endTime = cleanEnd.includes(' ') ? cleanEnd.split(' ')[1] : '';

                let timeStr = '';
                if (startTime && endTime) {
                    timeStr = ` • Pukul ${startTime} s/d ${endTime} WIB`;
                } else if (startTime) {
                    timeStr = ` • Pukul ${startTime} WIB`;
                }

                return `${dayName}, ${dayNum} ${monthName} ${yearNum}${timeStr}`;
            } catch (e) {
                return `${startStr} s/d ${endStr}`;
            }
        }

        // Fungsionalitas Dokumentasi (Terintegrasi secara eksklusif dengan tombol Lihat Dokumentasi)
        function bukaDokumentasi(link) {
            let modal = document.getElementById("krsDocModal");
            if (!modal) {
                modal = document.createElement("div");
                modal.id = "krsDocModal";
                document.body.appendChild(modal);
            }

            const activeTimer = modal.getAttribute("data-timer");
            if (activeTimer) {
                clearInterval(activeTimer);
                modal.removeAttribute("data-timer");
            }

            modal.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:99999; display:flex; justify-content:center; align-items:center; font-family:'Plus Jakarta Sans', sans-serif;";
            modal.style.display = "flex";

            modal.innerHTML = `
                <div style="background:#ffffff; padding:35px 30px; border-radius:16px; text-align:center; max-width:420px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; box-sizing:border-box;">
                  <div style="font-size:2rem; color:#8b0000; margin-bottom:15px;"><i class="fa-solid fa-server fa-beat"></i></div>
                  <div style="font-weight:700; font-size:1.1rem; color:#0f172a; margin-bottom:6px;">Menghubungkan ke server...</div>
                  <div style="font-size:0.85rem; color:#64748b; font-weight:500;">Memulai mencari sumber link dokumentasi.</div>
                </div>
            `;

            setTimeout(() => {
                modal.innerHTML = `
                    <div style="background:#ffffff; padding:35px 30px; border-radius:16px; text-align:center; max-width:420px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; box-sizing:border-box;">
                      <div style="font-size:2rem; color:#8b0000; margin-bottom:15px;"><i class="fa-solid fa-magnifying-glass-chart fa-spin"></i></div>
                      <div style="font-weight:700; font-size:1.1rem; color:#0f172a; margin-bottom:6px;">Mencari sumber link...</div>
                      <div style="font-size:0.85rem; color:#64748b; font-weight:500;">Memindai link dokumentasi.</div>
                    </div>
                `;

                setTimeout(() => {
                    const cleanLink = link ? link.trim() : "";
                    const isLinkValid = cleanLink !== "" && cleanLink !== "#" && cleanLink !== "undefined" && cleanLink !== "null";

                    if (isLinkValid) {
                        modal.innerHTML = `
                            <div style="background:#ffffff; padding:35px 30px; border-radius:16px; text-align:center; max-width:420px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; box-sizing:border-box;">
                              <div style="font-size:2rem; color:#16a34a; margin-bottom:15px;"><i class="fa-solid fa-circle-check"></i></div>
                              <div style="font-weight:700; font-size:1.1rem; color:#0f172a; margin-bottom:6px;">Sumber dokumentasi ditemukan</div>
                              <div style="font-size:0.85rem; color:#64748b; font-weight:500;">Tautan valid teridentifikasi.</div>
                            </div>
                        `;

                        setTimeout(() => {
                            modal.innerHTML = `
                                <div style="background:#ffffff; padding:35px 30px; border-radius:16px; text-align:center; max-width:420px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; box-sizing:border-box;">
                                  <div style="font-size:2rem; color:#2563eb; margin-bottom:15px;"><i class="fa-solid fa-external-link-alt fa-bounce"></i></div>
                                  <div style="font-weight:700; font-size:1.1rem; color:#0f172a; margin-bottom:6px;">Terhubung ke server</div>
                                  <div style="font-size:0.85rem; color:#16a34a; font-weight:600;">Membuka tautan dokumentasi...</div>
                                </div>
                            `;

                            setTimeout(() => {
                                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                                if (isMobile) {
                                    const mobileWindow = window.open(cleanLink, "_blank");
                                    if (!mobileWindow || mobileWindow.closed || typeof mobileWindow.closed == 'undefined') {
                                        window.location.href = cleanLink;
                                    }
                                } else {
                                    const tempAnchor = document.createElement("a");
                                    tempAnchor.href = cleanLink;
                                    tempAnchor.target = "_blank";
                                    tempAnchor.rel = "noopener noreferrer";
                                    document.body.appendChild(tempAnchor);
                                    tempAnchor.click();
                                    document.body.removeChild(tempAnchor);
                                }
                                tutupPanelKrs();
                            }, 1500);
                        }, 1800);
                    } else {
                        modal.innerHTML = `
                            <div style="background:#ffffff; padding:35px 30px; border-radius:16px; text-align:center; max-width:440px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; box-sizing:border-box;">
                              <div style="font-size:2rem; color:#dc2626; margin-bottom:15px;"><i class="fa-solid fa-circle-exclamation"></i></div>
                              <div style="font-weight:700; font-size:1.1rem; color:#0f172a; margin-bottom:6px;">Sumber dokumentasi tidak ditemukan</div>
                              <div style="font-size:0.85rem; color:#64748b; font-weight:500;">Tautan untuk kegiatan ini belum tersedia.</div>
                            </div>
                        `;

                        setTimeout(() => {
                            let countdown = 5;
                            modal.innerHTML = `
                                <div style="background:#ffffff; padding:30px; border-radius:16px; text-align:left; max-width:480px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; box-sizing:border-box;">
                                  <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px; color:#8b0000; font-size:1.2rem;">
                                    <i class="fa-solid fa-triangle-exclamation"></i>
                                    <span style="font-weight:700; font-size:1rem; color:#0f172a;">Dokumentasi Tidak Ditemukan</span>
                                  </div>
                                  <div style="font-size:0.9rem; color:#334155; line-height:1.6; margin-bottom:20px; font-weight:400;">
                                    Mohon maaf, Silakan hubungi panitia yang bersangkutan untuk informasi lebih lanjut.
                                  </div>
                                  <button onclick="tutupPanelKrs()" style="width:100%; padding:11px 20px; background:#0f172a; color:#fff; border:none; border-radius:8px; font-weight:600; font-size:0.9rem; cursor:pointer; transition:background 0.2s;">
                                    Kembali ke Beranda (<span id="countdownTimer">${countdown}</span>s)
                                  </button>
                                </div>
                            `;

                            const countdownInterval = setInterval(() => {
                                countdown--;
                                const timerSpan = document.getElementById("countdownTimer");
                                if (timerSpan) timerSpan.innerText = countdown;

                                if (countdown <= 0) {
                                    clearInterval(countdownInterval);
                                    tutupPanelKrs();
                                }
                            }, 1000);

                            modal.setAttribute("data-timer", countdownInterval);
                        }, 1800);
                    }
                }, 1800);
            }, 1800);
        }

        function tutupPanelKrs() {
            const modal = document.getElementById("krsDocModal");
            if (modal) {
                const activeTimer = modal.getAttribute("data-timer");
                if (activeTimer) clearInterval(activeTimer);
                modal.style.display = "none";
            }
        }

        const hamburgerToggle = document.getElementById('hamburgerToggle');
        const menu = document.getElementById('menu');

        function triggerKirimBerita() {
            if (menu) menu.classList.remove('active');
            if (typeof bukaModalProtokol === 'function') {
                bukaModalProtokol();
            } else if (typeof bukaPersetujuan === 'function') {
                bukaPersetujuan();
            }
            setTimeout(forceCenterModal, 10);
            setTimeout(forceCenterModal, 50);
        }

        if (hamburgerToggle && menu) {
            hamburgerToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                menu.classList.toggle('active');
            });

            document.addEventListener('click', function(event) {
                if (!document.getElementById('mainNav').contains(event.target)) {
                    menu.classList.remove('active');
                }
            });
        }

        // Pemantau mutasi yang dibatasi khusus untuk modal persetujuan dari persetujuan.js saja
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.addedNodes.length > 0) {
                    forceCenterModal();
                }
            });
        });

        observer.observe(document.body, { childList: true, subtree: true });

        document.addEventListener("DOMContentLoaded", function() {
            let currentStatus = 'all';
            let currentYear = 'all';
            let selectedFilterDate = null;
            
            let todayDate = new Date();
            let activeMonth = todayDate.getMonth();
            let activeYear = todayDate.getFullYear();

            const agendaListEl = document.getElementById('agendaList');
            const yearSelectEl = document.getElementById('yearFilter');
            const calendarGridEl = document.getElementById('calendarGrid');
            const calendarMonthYearEl = document.getElementById('calendarMonthYear');
            const btnReloadAcara = document.getElementById('btnReloadAcara');

            function getCalculatedStatus(startStr, endStr) {
                const now = new Date();
                const start = new Date(startStr);
                const end = new Date(endStr);

                if (now < start) {
                    return { text: "Akan Datang", className: "status-akan-datang" };
                } else if (now >= start && now <= end) {
                    return { text: "Berlangsung", className: "status-berlangsung" };
                } else {
                    return { text: "Selesai", className: "status-selesai" };
                }
            }

           function initYearDropdown() {
                yearSelectEl.innerHTML = '<option value="all">Semua Tahun</option>';
                
                let years = [];
                if (typeof DATABASE_AGENDA !== 'undefined') {
                    years = DATABASE_AGENDA.map(item => new Date(item.start).getFullYear());
                }
                
                const realTimeYear = new Date().getFullYear();
                years.push(realTimeYear);
                
                const uniqueYears = [...new Set(years)].sort((a, b) => b - a);
                
                uniqueYears.forEach(year => {
                    const opt = document.createElement('option');
                    opt.value = year;
                    opt.textContent = year;
                    yearSelectEl.appendChild(opt);
                });
            }

           yearSelectEl.addEventListener('change', function() {
                currentYear = this.value;
                selectedFilterDate = null;
                
                // Integrasi: Jika tahun spesifik dipilih, ubah tahun kalender 
                // dan arahkan bulannya persis ke bulan real-time saat ini
                if (currentYear !== 'all') {
                    const targetYearNum = parseInt(currentYear);
                    const now = new Date(); // Waktu real-time saat ini
                    
                    activeYear = targetYearNum;
                    activeMonth = now.getMonth(); // Selalu set ke bulan real-time saat ini
                    
                    renderCalendar(activeMonth, activeYear);
                }
                
                renderAgendas();
            });

            function renderAgendas() {
                if (typeof DATABASE_AGENDA === 'undefined') {
                    agendaListEl.innerHTML = '<div class="no-agenda">DATABASE_AGENDA tidak ditemukan di agenda-data.js.</div>';
                    return;
                }

                let sortedData = [...DATABASE_AGENDA].sort((a, b) => {
                    return new Date(b.start) - new Date(a.start) || parseInt(b.id || 0) - parseInt(b.id || 0);
                });

                let filtered = sortedData.filter(item => {
                    const itemYear = new Date(item.start).getFullYear().toString();
                    const statusObj = getCalculatedStatus(item.start, item.end);
                    
                    const matchStatus = (currentStatus === 'all' || statusObj.text.toLowerCase() === currentStatus);
                    const matchYear = (currentYear === 'all' || itemYear === currentYear);
                    
                    let matchDate = true;
                    if (selectedFilterDate) {
                        matchDate = item.start.startsWith(selectedFilterDate);
                    }

                    return matchStatus && matchYear && matchDate;
                });

                if (filtered.length === 0) {
                    const message = selectedFilterDate ? 'Belum ada acara terdeteksi' : 'Tidak ada agenda yang sesuai dengan filter.';
                    agendaListEl.innerHTML = `<div class="no-agenda">${message}</div>`;
                    return;
                }

                agendaListEl.innerHTML = '';
                filtered.forEach(agenda => {
                    const statusObj = getCalculatedStatus(agenda.start, agenda.end);
                    const formattedDateStr = formatFriendlyDate(agenda.start, agenda.end);

                    let actionBtnHtml = '';
                    if (statusObj.text === "Selesai" || (agenda.docLink && agenda.docLink.trim() !== '')) {
                        const linkAttr = agenda.docLink ? `data-link="${agenda.docLink}"` : `data-link=""`;
                        actionBtnHtml = `<button class="agenda-action-btn btn-dokumen" ${linkAttr}><i class="fa-solid fa-folder-open"></i> Lihat Dokumentasi</button>`;
                    }

                    let bannerHtml = `
                        <div class="agenda-poster-wrapper">
                            <img src="${agenda.banner || 'placeholder.jpg'}" alt="${agenda.title}" onerror="this.src='https://via.placeholder.com/1080x1350/f1f5f9/dc2626?text=KRS.INFO'">
                        </div>
                    `;

                    const card = document.createElement('div');
                    card.className = 'agenda-item-card';
                    card.innerHTML = `
                        <span class="agenda-status-badge ${statusObj.className}">${statusObj.text}</span>
                        ${bannerHtml}
                        <div class="agenda-content-box">
                            <div class="agenda-info">
                                <h3>${agenda.title}</h3>
                                <div class="agenda-date-loc">
                                    <span><i class="fa-regular fa-calendar"></i> ${formattedDateStr}</span>
                                    <span><i class="fa-solid fa-location-dot"></i> ${agenda.location}</span>
                                </div>
                                <p class="agenda-desc">${agenda.desc}</p>
                                ${actionBtnHtml}
                            </div>
                        </div>
                    `;
                    agendaListEl.appendChild(card);
                });

                document.querySelectorAll('.btn-dokumen').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const link = this.getAttribute('data-link');
                        bukaDokumentasi(link);
                    });
                });
            }

            function renderCalendar(month, year) {
                calendarGridEl.innerHTML = '';
                
                const monthsNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
                calendarMonthYearEl.textContent = `${monthsNames[month]} ${year}`;

                const daysName = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
                daysName.forEach(name => {
                    const dayEl = document.createElement('div');
                    dayEl.className = 'calendar-day-name';
                    dayEl.textContent = name;
                    calendarGridEl.appendChild(dayEl);
                });

                const firstDayIndex = new Date(year, month, 1).getDay();
                const totalDays = new Date(year, month + 1, 0).getDate();

                for (let i = 0; i < firstDayIndex; i++) {
                    calendarGridEl.appendChild(document.createElement('div'));
                }

                let eventDates = [];
                if (typeof DATABASE_AGENDA !== 'undefined') {
                    DATABASE_AGENDA.forEach(item => {
                        const d = new Date(item.start);
                        if(d.getMonth() === month && d.getFullYear() === year) {
                            eventDates.push(d.getDate());
                        }
                    });
                }

                for (let day = 1; day <= totalDays; day++) {
                    const dateEl = document.createElement('div');
                    dateEl.className = 'calendar-date';
                    dateEl.textContent = day;

                    if (eventDates.includes(day)) {
                        dateEl.classList.add('active-event');
                        dateEl.title = "Ada agenda pada tanggal ini!";
                    }

                    dateEl.addEventListener('click', function() {
                        const formattedMonth = String(month + 1).padStart(2, '0');
                        const formattedDay = String(day).padStart(2, '0');
                        selectedFilterDate = `${year}-${formattedMonth}-${formattedDay}`;
                        
                        currentStatus = 'all';
                        currentYear = 'all';
                        yearSelectEl.value = 'all';
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        document.querySelector('.filter-btn[data-status="all"]').classList.add('active');
                        
                        renderAgendas();
                    });

                    calendarGridEl.appendChild(dateEl);
                }
            }

            document.getElementById('prevMonth').addEventListener('click', () => {
                activeMonth--;
                if(activeMonth < 0) { activeMonth = 11; activeYear--; }
                renderCalendar(activeMonth, activeYear);
            });

            document.getElementById('nextMonth').addEventListener('click', () => {
                activeMonth++;
                if(activeMonth > 11) { activeMonth = 0; activeYear++; }
                renderCalendar(activeMonth, activeYear);
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentStatus = this.getAttribute('data-status');
                    selectedFilterDate = null;
                    renderAgendas();
                });
            });

            yearSelectEl.addEventListener('change', function() {
                currentYear = this.value;
                selectedFilterDate = null;
                renderAgendas();
            });

            if (btnReloadAcara) {
                btnReloadAcara.addEventListener('click', function() {
                    currentStatus = 'all';
                    currentYear = 'all';
                    selectedFilterDate = null;
                    yearSelectEl.value = 'all';
                    
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    document.querySelector('.filter-btn[data-status="all"]').classList.add('active');
                    
                    todayDate = new Date();
                    activeMonth = todayDate.getMonth();
                    activeYear = todayDate.getFullYear();
                    
                    renderCalendar(activeMonth, activeYear);
                    renderAgendas();
                });
            }

            initYearDropdown();
            renderAgendas();
            renderCalendar(activeMonth, activeYear);
        });
    </script>
    <!-- Penampung Footer Otomatis -->
    <div id="footer-placeholder"></div>

    <!-- Script untuk Memuat Footer Sekali Panggil -->
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
</body>
